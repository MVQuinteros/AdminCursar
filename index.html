<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Panel de administración de CURSAR: gestión de usuarios, ofertas, instituciones, avisos y soporte." />
  <title>CURSAR · Panel de administración</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23007BFF'/%3E%3Ctext x='16' y='22' font-size='18' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3EC%3C/text%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cursar-theme');
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css" />

  <script type="importmap">
  {
    "imports": {
      "firebase/app":        "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js",
      "firebase/auth":       "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js",
      "firebase/firestore":  "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js",
      "chart.js":            "https://cdn.jsdelivr.net/npm/chart.js@4.4.3/+esm"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toast-region" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
